<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stroboscope Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .search-box {
    position: relative;
  }

  .search-box input {
    background: transparent;
    border: 1px solid #333;
    color: #fff;
    padding: 10px 18px;
    border-radius: 25px;
    font-size: 14px;
    width: 260px;
    outline: none;
    transition: border-color 0.3s;
  }

  .search-box input:focus {
    border-color: #00bfff;
  }

  .support {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }

  .support a {
    color: #00bfff;
    text-decoration: none;
  }

  .support a:hover {
    text-decoration: underline;
  }

  .lang-flags {
    display: flex;
    gap: 6px;
    margin-left: 10px;
  }

  .lang-flags span {
    font-size: 20px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.3s;
  }

  .lang-flags span.active {
    opacity: 1;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 40px 30px;
    padding: 40px 60px 60px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .circle-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
  }

  .circle-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.08));
    transition: transform 0.4s ease, filter 0.4s ease;
    cursor: pointer;
  }

  .circle-card:hover .circle-svg {
    transform: scale(1.05);
    filter: drop-shadow(0 0 35px rgba(255,255,255,0.18));
  }

  .top-arc, .bottom-arc {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 55%;
    height: 22%;
    pointer-events: none;
  }

  .top-arc {
    top: -8%;
  }

  .bottom-arc {
    bottom: -8%;
  }

  .top-arc svg, .bottom-arc svg {
    width: 100%;
    height: 100%;
  }

  .label-top, .label-bottom {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 800;
    font-size: clamp(11px, 1.4vw, 18px);
    letter-spacing: 1.5px;
    text-shadow: 0 0 8px currentColor, 0 2px 4px rgba(0,0,0,0.9);
    pointer-events: none;
    white-space: nowrap;
  }

  .label-top {
    top: -14%;
  }

  .label-bottom {
    bottom: -14%;
    font-size: clamp(14px, 1.8vw, 22px);
  }

  .circle-info {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
  }

  .circle-info .ticker {
    color: #00bfff;
    font-weight: 700;
    font-size: 13px;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: #555;
    font-size: 12px;
    border-top: 1px solid #1a1a1a;
  }

  footer a { color: #00bfff; text-decoration: none; }

  @media (max-width: 1100px) {
    .gallery { grid-template-columns: repeat(3, 1fr); padding: 30px 20px; gap: 30px 20px; }
  }
  @media (max-width: 600px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
    header { padding: 15px 20px; flex-wrap: wrap; gap: 10px; }
    .search-box input { width: 200px; }
  }
</style>
</head>
<body>

<header>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by name...">
  </div>
  <div class="support">
    <span>✕</span>
    <span>✈</span>
    <a href="mailto:stroboscope@atomicmail.io">@SUPPORT</a>
    <div class="lang-flags">
      <span class="active" title="English">🇬🇧</span>
      <span title="Spanish">🇪🇸</span>
      <span title="Chinese">🇨🇳</span>
      <span title="Hindi">🇮🇳</span>
      <span title="Arabic">🇸🇦</span>
      <span title="French">🇫🇷</span>
      <span title="Russian">🇷🇺</span>
      <span title="Portuguese">🇧🇷</span>
    </div>
  </div>
</header>

<main class="gallery" id="gallery"></main>

<footer>
  Interactive audio-visual kaomoji drop on Solana · 
  <a href="https://stroboscope.vercel.app">stroboscope.vercel.app</a> · 
  stroboscope@atomicmail.io
</footer>

<script>
const circles = [
  { num:1,  name:"TENDER", ticker:"$TENDER", kaomoji:"ヽ(♡‿♡)ノ", theme:"Neon",     colors:["#ff1493","#00bfff","#ffffff","#ff69b4","#87ceeb","#ff1493"] },
  { num:2,  name:"HYPE",   ticker:"$HYPE",   kaomoji:"٩(◕‿◕｡)۶", theme:"Prism",    colors:["#ff0000","#ff7f00","#ffff00","#00ff00","#0000ff","#8b00ff"] },
  { num:3,  name:"BLOOM",  ticker:"$BLOOM",  kaomoji:"(✿◠‿◠)",   theme:"Roots",    colors:["#ff8c00","#228b22","#ffd700","#32cd32","#ff6347","#ff8c00"] },
  { num:4,  name:"SMIRK",  ticker:"$SMIRK",  kaomoji:"(¬‿¬)",    theme:"Eclipse",  colors:["#cc7722","#8b4513","#daa520","#cd853f","#f4a460","#cc7722"] },
  { num:5,  name:"COZY",   ticker:"$COZY",   kaomoji:"(づ◡﹏◡)づ",theme:"Tide",     colors:["#008b8b","#00008b","#40e0d0","#00ced1","#4682b4","#008b8b"] },
  { num:6,  name:"FIGHT",  ticker:"$FIGHT",  kaomoji:"(ง •̀_•́)ง",theme:"Ember",    colors:["#ff0000","#ff4500","#ff6347","#dc143c","#b22222","#ff0000"] },
  { num:7,  name:"HUGS",   ticker:"$HUGS",   kaomoji:"(づ｡◕‿‿◕｡)づ",theme:"Sunset", colors:["#ffa500","#40e0d0","#ffd700","#ff8c00","#20b2aa","#ffa500"] },
  { num:8,  name:"RAGE",   ticker:"$RAGE",   kaomoji:"(ノಠ益ಠ)ノ",theme:"Overdrive",colors:["#ff0000","#ff4500","#dc143c","#ff6347","#b22222","#ff0000"] },
  { num:9,  name:"KISS",   ticker:"$KISS",   kaomoji:"(づ￣ ³￣)づ",theme:"Flux",   colors:["#98fb98","#ff7f50","#00fa9a","#ff6347","#7fffd4","#98fb98"] },
  { num:10, name:"FLIP",   ticker:"$FLIP",   kaomoji:"(╯°□°）╯︵ ┻━┻",theme:"Hypnosis",colors:["#bf00ff","#7fff00","#da70d6","#32cd32","#9370db","#bf00ff"] },
  { num:11, name:"STAR",   ticker:"$STAR",   kaomoji:"(★^O^★)",  theme:"MOON",     colors:["#ffff00","#0000ff","#ffd700","#4169e1","#fffacd","#ffff00"] },
  { num:12, name:"DEAL",   ticker:"$DEAL",   kaomoji:"(⌐■_■)",   theme:"HODL",     colors:["#8b00ff","#00ced1","#9370db","#48d1cc","#ba55d3","#8b00ff"] },
  { num:13, name:"MEOW",   ticker:"$MEOW",   kaomoji:"(=^･ω･^=)",theme:"WAGMI",    colors:["#39ff14","#000000","#7fff00","#228b22","#adff2f","#39ff14"] },
  { num:14, name:"SOB",    ticker:"$SOB",    kaomoji:"(ಥ﹏ಥ)",   theme:"Ocean",    colors:["#00008b","#f5f5dc","#4169e1","#d2b48c","#1e90ff","#00008b"] },
  { num:15, name:"SHRUG",  ticker:"$SHRUG",  kaomoji:"¯\\_(ツ)_/¯",theme:"Zero",    colors:["#000000","#ffffff","#808080","#c0c0c0","#333333","#000000"] }
];

const gallery = document.getElementById('gallery');

function buildCircleSVG(c) {
  const size = 200;
  const cx = size/2, cy = size/2;
  const rings = c.colors.length;
  const maxR = 90;
  const step = maxR / rings;

  let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;

  // Outer glow
  svg += `<circle cx="${cx}" cy="${cy}" r="${maxR+4}" fill="none" stroke="${c.colors[0]}" stroke-width="1" opacity="0.3"/>`;

  // Concentric rings from outer to inner
  for (let i = 0; i < rings; i++) {
    const r = maxR - i * step;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.colors[i]}" stroke-width="${step-1}" />`;
  }

  // Center dot
  svg += `<circle cx="${cx}" cy="${cy}" r="${step/2}" fill="${c.colors[rings-1]}"/>`;

  svg += `</svg>`;
  return svg;
}

function buildArcSVG(color, position) {
  // position: 'top' or 'bottom'
  const w = 200, h = 80;
  const rx = w/2, ry = h;
  let d;
  if (position === 'top') {
    // Arc from left to right, bulging upward
    d = `M 5,${h} A ${rx-5},${ry-5} 0 0 1 ${w-5},${h} Z`;
  } else {
    d = `M 5,0 A ${rx-5},${ry-5} 0 0 0 ${w-5},0 Z`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <path d="${d}" fill="${color}" opacity="0.95"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1" opacity="0.5"/>
  </svg>`;
}

circles.forEach(c => {
  const card = document.createElement('div');
  card.className = 'circle-card';
  card.dataset.name = c.name.toLowerCase();
  card.dataset.ticker = c.ticker.toLowerCase();
  card.dataset.kaomoji = c.kaomoji.toLowerCase();

  const outerColor = c.colors[0];
  const secondColor = c.colors[1];

  card.innerHTML = `
    <div class="circle-wrapper">
      <div class="top-arc">${buildArcSVG(outerColor, 'top')}</div>
      <div class="bottom-arc">${buildArcSVG(outerColor, 'bottom')}</div>
      <div class="circle-svg">${buildCircleSVG(c)}</div>
      <div class="label-top" style="color:${secondColor}">${c.name}</div>
      <div class="label-bottom" style="color:${secondColor}">${c.kaomoji}</div>
    </div>
    <div class="circle-info">
      Circle ${String(c.num).padStart(2,'0')}/15 · <span class="ticker">${c.ticker}</span>
    </div>
  `;

  card.querySelector('.circle-svg').addEventListener('click', () => {
    alert(`Circle ${c.num}/15 (${c.ticker}) — ${c.kaomoji}\nInteractive audio-visual kaomoji drop on Solana.\nTap the circle on stroboscope.vercel.app to pulse with the beat.`);
  });

  gallery.appendChild(card);
});

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.circle-card').forEach(card => {
    const match = !q || 
      card.dataset.name.includes(q) || 
      card.dataset.ticker.includes(q) || 
      card.dataset.kaomoji.includes(q);
    card.style.display = match ? '' : 'none';
  });
});

// Language flags (visual only)
document.querySelectorAll('.lang-flags span').forEach(flag => {
  flag.addEventListener('click', () => {
    document.querySelectorAll('.lang-flags span').forEach(f => f.classList.remove('active'));
    flag.classList.add('active');
  });
});
</script>

</body>
</html>
