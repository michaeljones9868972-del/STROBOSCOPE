<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stroboscope - Neon</title>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon16x16.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
  
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; cursor: pointer; }
    
    .back-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(160, 216, 241, 0.5);
      color: #a0d8f1;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Martian Mono', monospace;
      font-size: 14px;
      transition: all 0.3s;
      text-decoration: none;
      display: block;
    }
    .back-btn:hover {
      background: rgba(160, 216, 241, 0.2);
      color: #fff;
    }
    
    .hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(160, 216, 241, 0.7);
      font-family: 'Martian Mono', monospace;
      font-size: 13px;
      z-index: 1000;
      pointer-events: none;
      transition: opacity 1s ease;
      text-align: center;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 6px;
    }
    .hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">✕ CLOSE</a>
  <div class="hint" id="hint">CLICK TO START SOUND</div>
  
  <script>
    let cols = ['#FE00EC', '#049CE4', '#02C9AF', '#2B4F8D', '#011034', '#ffffff', '#FE00EC', '#049CE4', '#02C9AF', '#2B4F8D', '#011034'];
    let MAX_INIT_SIZE, MAX_ANGLE_STEP, SIZE_MULT, MIN_SIZE;
    let initSize, initAngle, initColIndex;
    let isPlaying = true, isPaused = false, pausedLevel = 0;
    let song, amplitude, level = 0, lastLevel = 0;
    let particles = [], lastBurstTime = 0, minBurstInterval = 300;
    let isSongLoaded = false, isAudioStarted = false;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      rectMode(CENTER); noStroke();
      MAX_INIT_SIZE = max(width, height) * 0.4;
      MAX_ANGLE_STEP = PI / 20; SIZE_MULT = 0.88; MIN_SIZE = 8;
      initSize = MAX_INIT_SIZE; initAngle = 0; initColIndex = 0;

      amplitude = new p5.Amplitude();
      amplitude.smooth(0.8);

      // Загружаем музыку, но НЕ запускаем автоматически
      song = loadSound('m1.mp3', () => {
        isSongLoaded = true;
        amplitude.setInput(song);
        // Пробуем запустить сразу (сработает на десктопе, если пользователь уже кликнул ранее)
        tryStartAudio();
      }, (err) => { console.error('Ошибка загрузки m1.mp3:', err); });

      // Первый клик/тап — запускаем звук + fullscreen
      const canvasEl = document.querySelector('canvas');
      canvasEl.addEventListener('click', onCanvasClick);
      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        onCanvasClick();
      }, { passive: false });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          if (!isAudioStarted) { tryStartAudio(); }
          else { togglePause(); }
        }
        if (e.key === 'Escape') {
          window.location.href = 'index.html';
        }
      });
    }

    function onCanvasClick() {
      if (!isAudioStarted) {
        tryStartAudio();
      } else {
        togglePause();
      }
    }

    function tryStartAudio() {
      if (!isSongLoaded || isAudioStarted) return;
      userStartAudio().then(() => {
        isAudioStarted = true;
        song.loop();
        lastBurstTime = millis();
        // Скрыть подсказку
        const hint = document.getElementById('hint');
        if (hint) hint.classList.add('hidden');
        // Fullscreen (только после жеста пользователя)
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      }).catch(() => {
        // Браузер заблокировал — ждём клика
      });
    }

    function togglePause() {
      if (!isAudioStarted) return;
      isPaused = !isPaused;
      if (isPaused) {
        pausedLevel = level;
        if (song) song.pause();
      } else {
        if (song) song.loop();
        lastBurstTime = millis();
      }
    }

    function draw() {
      background(0);
      
      // Если звук не запущен — рисуем "холостую" анимацию (без реакции на биты)
      const effectiveLevel = isAudioStarted ? level : 0.15 + 0.1 * sin(frameCount / 30);
      
      if (isPaused) {
        for (let particle of particles) particle.show();
        let count = sin(frameCount / 150);
        let angleStep = PI / 20 * count;
        let colIndex = initColIndex;
        let size = initSize * map(pausedLevel, 0, 0.5, 1, 1.5);
        let angle = initAngle;
        while (size > MIN_SIZE) {
          push(); translate(width / 2, height / 2); rotate(angle);
          fill(cols[colIndex % cols.length]); ellipse(0, 0, size, size); pop();
          angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
          size *= 0.88; colIndex++;
        }
        return;
      }
      
      if (isAudioStarted) {
        level = amplitude.getLevel();
        let delta = abs(level - lastLevel);
        let now = millis();
        if (delta > 0.03 && level > 0.05 && now - lastBurstTime > minBurstInterval) {
          particles = [];
          createBurst(initSize, cols[initColIndex % cols.length]);
          lastBurstTime = now;
        }
        lastLevel = level;
      } else {
        level = effectiveLevel;
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(); particles[i].show();
        if (particles[i].isDead()) particles.splice(i, 1);
      }
      
      let count = sin(frameCount / 150);
      let angleStep = PI / 20 * count;
      let colIndex = initColIndex;
      let size = initSize * map(level, 0, 0.5, 1, 1.5);
      let angle = initAngle;
      while (size > MIN_SIZE) {
        push(); translate(width / 2, height / 2); rotate(angle);
        fill(cols[colIndex % cols.length]); ellipse(0, 0, size, size); pop();
        angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
        size *= 0.88; colIndex++;
      }
      initSize -= MAX_INIT_SIZE * 0.0013 * (10 + abs(count));
      initAngle += angleStep * 0.1;
      if (initSize < MAX_INIT_SIZE * 0.88) {
        initSize /= 0.88;
        initColIndex = (initColIndex + cols.length - 1) % cols.length;
      }
    }

    function createBurst(size, color) {
      const numParticles = 50;
      const center = { x: width / 2, y: height / 2 };
      for (let i = 0; i < numParticles; i++) particles.push(new Particle(center.x, center.y, color));
    }

    class Particle {
      constructor(x, y, col) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(3, 10));
        this.acc = createVector(0, 0);
        this.lifespan = 60; this.maxLife = this.lifespan;
        this.color = col; this.size = random(2, 4);
      }
      update() { this.vel.add(this.acc); this.pos.add(this.vel); this.lifespan--; }
      show() {
        let alpha = map(this.lifespan, 0, this.maxLife, 0, 255);
        if (this.lifespan < 15) alpha *= sin(frameCount * 0.2 + this.lifespan) * 0.5 + 0.5;
        noStroke();
        fill(red(this.color), green(this.color), blue(this.color), alpha);
        ellipse(this.pos.x, this.pos.y, this.size);
      }
      isDead() { return this.lifespan < 0; }
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>
</html>
