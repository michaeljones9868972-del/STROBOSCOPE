<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stroboscope - Neon</title>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon16x16.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; cursor: pointer; }
    .sound-btn, .close-btn {
      position: fixed; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(0,0,0,0.7);
      border: 2px solid rgba(160,216,241,0.6); cursor: pointer;
      transition: all 0.4s ease; backdrop-filter: blur(8px);
    }
    .sound-btn { bottom: 30px; right: 30px; width: 60px; height: 60px; }
    .close-btn { top: 20px; right: 20px; width: 50px; height: 50px; }
    .sound-btn svg { width: 32px; height: 32px; fill: #fff; }
    .close-btn svg { width: 24px; height: 24px; fill: #fff; }
    .sound-btn:hover, .close-btn:hover { transform: scale(1.1); }
    .sound-btn.active { border-color: #4ade80; box-shadow: 0 0 20px rgba(74,222,128,0.5); }
    .sound-btn.active svg { fill: #4ade80; }
    .close-btn:hover { background: rgba(255,50,50,0.3); border-color: #ff6464; }
    .hidden-btns { opacity: 0 !important; pointer-events: none !important; }
    iframe[src*="netlify"], .netlify-badge, #netlify-badge, [class*="netlify-badge"], [id*="netlify-badge"] {
      display: none !important; visibility: hidden !important; opacity: 0 !important;
      pointer-events: none !important; width: 0 !important; height: 0 !important;
      position: fixed !important; z-index: -9999 !important; left: -9999px !important; top: -9999px !important;
    }
  </style>
</head>
<body>
  <button class="sound-btn" id="soundBtn" title="Play sound">
    <svg id="soundIcon" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
  </button>
  <button class="close-btn" id="closeBtn" title="Close (Esc)">
    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>

  <script>
    let cols = ['#FE00EC', '#049CE4', '#02C9AF', '#2B4F8D', '#011034', '#ffffff',
                '#FE00EC', '#049CE4', '#02C9AF', '#2B4F8D', '#011034'];
    let MAX_INIT_SIZE, MIN_SIZE;
    let initSize, initAngle, initColIndex;
    let isPaused = false, pausedLevel = 0;
    let song, amplitude, fft, level = 0, lastLevel = 0;
    let particles = [], lastBurstTime = 0, minBurstInterval = 300;
    let isAudioStarted = false;
    let detachedRings = [];
    let bassEnergy = 0, prevBassEnergy = 0, beatDecay = 0, smoothLevel = 0, pulseIntensity = 0;
    let beatDetected = false;
    let lastDetachTime = 0;

    function setup() {
      let cnv = createCanvas(windowWidth, windowHeight);
      cnv.style('position','fixed'); cnv.style('top','0'); cnv.style('left','0'); cnv.style('z-index','1');
      rectMode(CENTER); noStroke();
      // УВЕЛИЧЕН РАЗМЕР чтобы круг достигал края экрана
      MAX_INIT_SIZE = max(width, height) * 0.55;
      MIN_SIZE = 8;
      initSize = MAX_INIT_SIZE; initAngle = 0; initColIndex = 0;
      amplitude = new p5.Amplitude(); amplitude.smooth(0.8);
      fft = new p5.FFT(0.8, 1024);
      song = loadSound('m1.mp3', () => { amplitude.setInput(song); fft.setInput(song); },
        (e) => console.error('m1.mp3:', e));

      document.getElementById('soundBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!isAudioStarted) tryStartAudio(); else toggleMute();
      });
      document.getElementById('closeBtn').addEventListener('click', (e) => {
        e.stopPropagation(); window.location.href = 'index.html';
      });
      // ПАУЗА ПО КЛИКУ НА ЭКРАН
      document.addEventListener('click', (e) => {
        if (e.target.tagName === 'CANVAS' || e.target === document.body) {
          if (isAudioStarted) togglePause();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); if (!isAudioStarted) tryStartAudio(); else togglePause(); }
        if (e.key === 'Escape') window.location.href = 'index.html';
        if (e.key === 'm' || e.key === 'M') toggleMute();
      });
    }

    function tryStartAudio() {
      if (!song || isAudioStarted) return;
      userStartAudio().then(() => {
        isAudioStarted = true; song.loop(); lastBurstTime = millis();
        updateSoundIcon(true);
        document.getElementById('soundBtn').classList.add('hidden-btns');
        document.getElementById('closeBtn').classList.add('hidden-btns');
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
      }).catch(()=>{});
    }

    function toggleMute() {
      if (!isAudioStarted) return;
      if (song.isPlaying()) { song.pause(); updateSoundIcon(false); }
      else { song.loop(); updateSoundIcon(true); lastBurstTime = millis(); }
    }

    function updateSoundIcon(p) {
      const b = document.getElementById('soundBtn'), i = document.getElementById('soundIcon');
      if (p) { b.classList.add('active'); i.innerHTML='<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>'; }
      else { b.classList.remove('active'); i.innerHTML='<path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'; }
    }

    function togglePause() {
      if (!isAudioStarted) return;
      isPaused = !isPaused;
      if (isPaused) { 
        pausedLevel = level; 
        song.pause(); 
        updateSoundIcon(false); 
        particles=[]; 
        detachedRings=[]; 
        // Показываем кнопки при паузе
        document.getElementById('soundBtn').classList.remove('hidden-btns');
        document.getElementById('closeBtn').classList.remove('hidden-btns');
      } else { 
        song.loop(); 
        updateSoundIcon(true); 
        lastBurstTime = millis(); 
        // Скрываем кнопки при воспроизведении
        document.getElementById('soundBtn').classList.add('hidden-btns');
        document.getElementById('closeBtn').classList.add('hidden-btns');
      }
    }

    function analyzeAudio() {
      if (!isAudioStarted || !fft) return;
      const spec = fft.analyze(); const bins = spec.length;
      let bassSum = 0; const bassEnd = Math.floor(bins * 0.1);
      for (let i=0;i<bassEnd;i++) bassSum += spec[i]/255;
      bassEnergy = bassSum / bassEnd;
      if (bassEnergy - prevBassEnergy > 0.05 && bassEnergy > 0.12) { 
        beatDetected = true; 
        beatDecay = 1.0; 
      }
      prevBassEnergy = bassEnergy; 
      beatDecay *= 0.92;
      smoothLevel = smoothLevel*0.7 + amplitude.getLevel()*0.3;
      pulseIntensity = pulseIntensity*0.85 + beatDecay*0.15;
      level = smoothLevel + pulseIntensity*0.3;
    }

    function draw() {
      background(0);
      if (isPaused) { drawCirclesStatic(pausedLevel); return; }
      if (isAudioStarted) {
        analyzeAudio();
        let now = millis(); let delta = abs(level - lastLevel);
        if (delta > 0.04 && level > 0.08 && now - lastBurstTime > minBurstInterval) {
          particles = []; createBurst(cols[initColIndex % cols.length]); lastBurstTime = now;
        }
        lastLevel = level;
        // Отделение КОЛЬЦА при басах
        if (beatDetected && now - lastDetachTime > 400) {
          let edge = findEdgeCircle();
          if (edge) {
            detachRing(edge);
            lastDetachTime = now;
          }
        }
        beatDetected = false;
      } else { level = 0.15 + 0.1*sin(frameCount/30); bassEnergy = 0; }

      for (let i=particles.length-1;i>=0;i--){ particles[i].update(); particles[i].show(); if(particles[i].isDead()) particles.splice(i,1); }
      drawCirclesBeat(level);
      drawDetachedRings();

      let count = sin(frameCount/150);
      let angleStep = PI/20 * count;
      initSize -= MAX_INIT_SIZE * 0.001144 * (10 + abs(count));
      initAngle += angleStep * 0.1;
      if (initSize < MAX_INIT_SIZE * 0.88) { initSize /= 0.88; initColIndex = (initColIndex + cols.length - 1) % cols.length; }
    }

    function findEdgeCircle() {
      let size = initSize * map(level, 0, 0.6, 1, 1.8);
      let maxDim = max(width, height);
      // Срабатывает когда круг достигает края экрана
      if (size >= maxDim * 0.50) {
        let ringThickness = size * 0.12;
        return { 
          outerSize: size, 
          innerSize: size - ringThickness * 2,
          color: cols[initColIndex % cols.length] 
        };
      }
      return null;
    }

    function detachRing(r) {
      let angle = random(TWO_PI);
      let speed = random(2, 4);
      detachedRings.push({ 
        outerSize: r.outerSize, 
        innerSize: r.innerSize,
        color: r.color, 
        x: width/2, y: height/2,
        vx: cos(angle)*speed, vy: sin(angle)*speed, 
        life: 180, maxLife: 180 
      });
    }

    function drawDetachedRings() {
      for (let i=detachedRings.length-1;i>=0;i--) {
        let d = detachedRings[i];
        d.x += d.vx; d.y += d.vy; d.life--;
        d.outerSize *= 0.997;
        d.innerSize *= 0.997;
        let alpha = map(d.life, 0, d.maxLife, 0, 255);
        
        noStroke();
        fill(red(d.color), green(d.color), blue(d.color), alpha);
        ellipse(d.x, d.y, d.outerSize, d.outerSize);
        fill(0, alpha);
        ellipse(d.x, d.y, d.innerSize, d.innerSize);
        
        if (d.life <= 0 || d.outerSize < 20) detachedRings.splice(i,1);
      }
    }

    function drawCirclesBeat(l) {
      let count = sin(frameCount/150); let angleStep = PI/20*count;
      let colIndex = initColIndex; let size = initSize * map(l, 0, 0.6, 1, 1.8); let angle = initAngle;
      while (size > MIN_SIZE) {
        push(); translate(width/2,height/2); rotate(angle);
        fill(cols[colIndex % cols.length]); ellipse(0,0,size,size); pop();
        angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE*1.5, 1, 0, false);
        size *= 0.88; colIndex++;
      }
    }

    function drawCirclesStatic(l) {
      let angleStep = PI/20; let colIndex = initColIndex;
      let size = initSize * map(l, 0, 0.5, 1, 1.5); let angle = initAngle;
      while (size > MIN_SIZE) {
        push(); translate(width/2,height/2); rotate(angle);
        fill(cols[colIndex % cols.length]); ellipse(0,0,size,size); pop();
        angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE*1.5, 1, 0, false);
        size *= 0.88; colIndex++;
      }
    }

    function createBurst(color) { for (let i=0;i<60;i++) particles.push(new Particle(width/2, height/2, color)); }
    class Particle {
      constructor(x,y,col){ this.pos=createVector(x,y); this.vel=p5.Vector.random2D().mult(random(4,12));
        this.acc=createVector(0,0); this.lifespan=60; this.maxLife=60; this.color=col; this.size=random(2,5); }
      update(){ this.vel.add(this.acc); this.pos.add(this.vel); this.lifespan--; }
      show(){ let a=map(this.lifespan,0,this.maxLife,0,255); if(this.lifespan<15)a*=sin(frameCount*0.2+this.lifespan)*0.5+0.5;
        noStroke(); fill(red(this.color),green(this.color),blue(this.color),a); ellipse(this.pos.x,this.pos.y,this.size); }
      isDead(){ return this.lifespan<0; }
    }
    function windowResized(){ resizeCanvas(windowWidth, windowHeight); MAX_INIT_SIZE = max(width,height)*0.55; }
  </script>
</body>
</html>
