<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stroboscope - Цвета 1</title>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon16x16.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background: #000; 
    }
    canvas { 
      display: block; 
      cursor: pointer; 
    }
    
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
      cursor: pointer;
      flex-direction: column;
      gap: 30px;
    }
    
    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    /* PRESS — пепельно-белый */
    .press-text {
      font-family: 'Martian Mono', monospace;
      font-size: 90px;
      font-weight: 300;
      letter-spacing: 30px;
      user-select: none;
      color: #c8c8c8;
      text-shadow:
        0 0 8px rgba(200, 200, 200, 0.6),
        0 0 20px rgba(180, 180, 180, 0.3),
        0 0 40px rgba(150, 150, 150, 0.2);
      animation: press-glow 4s ease-in-out infinite alternate;
    }
    
    @keyframes press-glow {
      0% {
        color: #a8a8a8;
        text-shadow:
          0 0 8px rgba(168, 168, 168, 0.5),
          0 0 20px rgba(140, 140, 140, 0.3);
      }
      50% {
        color: #e0e0e0;
        text-shadow:
          0 0 12px rgba(224, 224, 224, 0.7),
          0 0 30px rgba(200, 200, 200, 0.4),
          0 0 50px rgba(180, 180, 180, 0.2);
      }
      100% {
        color: #b8b8b8;
        text-shadow:
          0 0 10px rgba(184, 184, 184, 0.6),
          0 0 25px rgba(160, 160, 160, 0.35);
      }
    }
    
    /* START — разноцветные буквы с 3D flip */
    .start-text {
      font-family: 'Martian Mono', monospace;
      font-size: 110px;
      font-weight: 800;
      letter-spacing: 15px;
      user-select: none;
      display: flex;
      gap: 5px;
      perspective: 1000px;
    }
    
    .start-letter {
      display: inline-block;
      transform-style: preserve-3d;
      animation: letter-flip 6s ease-in-out infinite;
    }
    
    .start-letter:nth-child(1) { 
      color: #ff006e; 
      animation-delay: 0s; 
      text-shadow: 0 0 20px #ff006e, 0 0 40px #ff006e;
    }
    .start-letter:nth-child(2) { 
      color: #8338ec; 
      animation-delay: 0.3s; 
      text-shadow: 0 0 20px #8338ec, 0 0 40px #8338ec;
    }
    .start-letter:nth-child(3) { 
      color: #3a86ff; 
      animation-delay: 0.6s; 
      text-shadow: 0 0 20px #3a86ff, 0 0 40px #3a86ff;
    }
    .start-letter:nth-child(4) { 
      color: #06d6a0; 
      animation-delay: 0.9s; 
      text-shadow: 0 0 20px #06d6a0, 0 0 40px #06d6a0;
    }
    .start-letter:nth-child(5) { 
      color: #ffbe0b; 
      animation-delay: 1.2s; 
      text-shadow: 0 0 20px #ffbe0b, 0 0 40px #ffbe0b;
    }
    
    @keyframes letter-flip {
      0%, 100% {
        transform: rotateY(0deg);
        opacity: 1;
      }
      25% {
        transform: rotateY(90deg);
        opacity: 0.3;
      }
      50% {
        transform: rotateY(180deg);
        opacity: 1;
      }
      75% {
        transform: rotateY(270deg);
        opacity: 0.3;
      }
    }
    
    /* Смена цвета каждой буквы */
    .start-letter:nth-child(1) { animation: flip1 6s ease-in-out infinite, color1 8s ease-in-out infinite; }
    .start-letter:nth-child(2) { animation: flip2 6s ease-in-out infinite, color2 8s ease-in-out infinite; }
    .start-letter:nth-child(3) { animation: flip3 6s ease-in-out infinite, color3 8s ease-in-out infinite; }
    .start-letter:nth-child(4) { animation: flip4 6s ease-in-out infinite, color4 8s ease-in-out infinite; }
    .start-letter:nth-child(5) { animation: flip5 6s ease-in-out infinite, color5 8s ease-in-out infinite; }
    
    @keyframes flip1 { 0%,100%{transform:rotateY(0deg)} 50%{transform:rotateY(360deg)} }
    @keyframes flip2 { 0%,100%{transform:rotateY(0deg)} 50%{transform:rotateY(360deg)} }
    @keyframes flip3 { 0%,100%{transform:rotateY(0deg)} 50%{transform:rotateY(360deg)} }
    @keyframes flip4 { 0%,100%{transform:rotateY(0deg)} 50%{transform:rotateY(360deg)} }
    @keyframes flip5 { 0%,100%{transform:rotateY(0deg)} 50%{transform:rotateY(360deg)} }
    
    @keyframes color1 {
      0%,100% { color: #ff006e; text-shadow: 0 0 20px #ff006e, 0 0 40px #ff006e; }
      20% { color: #ff6b6b; text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b; }
      40% { color: #ffd93d; text-shadow: 0 0 20px #ffd93d, 0 0 40px #ffd93d; }
      60% { color: #6bcb77; text-shadow: 0 0 20px #6bcb77, 0 0 40px #6bcb77; }
      80% { color: #4d96ff; text-shadow: 0 0 20px #4d96ff, 0 0 40px #4d96ff; }
    }
    @keyframes color2 {
      0%,100% { color: #8338ec; text-shadow: 0 0 20px #8338ec, 0 0 40px #8338ec; }
      20% { color: #c77dff; text-shadow: 0 0 20px #c77dff, 0 0 40px #c77dff; }
      40% { color: #ff006e; text-shadow: 0 0 20px #ff006e, 0 0 40px #ff006e; }
      60% { color: #ffbe0b; text-shadow: 0 0 20px #ffbe0b, 0 0 40px #ffbe0b; }
      80% { color: #06d6a0; text-shadow: 0 0 20px #06d6a0, 0 0 40px #06d6a0; }
    }
    @keyframes color3 {
      0%,100% { color: #3a86ff; text-shadow: 0 0 20px #3a86ff, 0 0 40px #3a86ff; }
      20% { color: #00b4d8; text-shadow: 0 0 20px #00b4d8, 0 0 40px #00b4d8; }
      40% { color: #8338ec; text-shadow: 0 0 20px #8338ec, 0 0 40px #8338ec; }
      60% { color: #ff006e; text-shadow: 0 0 20px #ff006e, 0 0 40px #ff006e; }
      80% { color: #ffd93d; text-shadow: 0 0 20px #ffd93d, 0 0 40px #ffd93d; }
    }
    @keyframes color4 {
      0%,100% { color: #06d6a0; text-shadow: 0 0 20px #06d6a0, 0 0 40px #06d6a0; }
      20% { color: #06d6a0; text-shadow: 0 0 20px #06d6a0, 0 0 40px #06d6a0; }
      40% { color: #3a86ff; text-shadow: 0 0 20px #3a86ff, 0 0 40px #3a86ff; }
      60% { color: #c77dff; text-shadow: 0 0 20px #c77dff, 0 0 40px #c77dff; }
      80% { color: #ff6b6b; text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b; }
    }
    @keyframes color5 {
      0%,100% { color: #ffbe0b; text-shadow: 0 0 20px #ffbe0b, 0 0 40px #ffbe0b; }
      20% { color: #ff006e; text-shadow: 0 0 20px #ff006e, 0 0 40px #ff006e; }
      40% { color: #06d6a0; text-shadow: 0 0 20px #06d6a0, 0 0 40px #06d6a0; }
      60% { color: #3a86ff; text-shadow: 0 0 20px #3a86ff, 0 0 40px #3a86ff; }
      80% { color: #8338ec; text-shadow: 0 0 20px #8338ec, 0 0 40px #8338ec; }
    }
  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <div class="press-text">PRESS</div>
    <div class="start-text" id="startText">
      <span class="start-letter">S</span>
      <span class="start-letter">T</span>
      <span class="start-letter">A</span>
      <span class="start-letter">R</span>
      <span class="start-letter">T</span>
    </div>
  </div>
  
  <script>
    let cols = ['#9AA8A8', '#466A44', '#E0D5BE', '#E0908D', '#C7495C', '#ffffff', '#680003', '#BC0000', '#F5704A', '#EFB9AD', '#828D00'];
    let MAX_INIT_SIZE, MAX_ANGLE_STEP, SIZE_MULT, MIN_SIZE;
    let initSize, initAngle, initColIndex;
    let isPlaying = false;
    let isPaused = false;
    let pausedLevel = 0;
    let song;
    let amplitude;
    let level;
    let lastLevel = 0;
    let particles = [];
    let lastBurstTime = 0;
    let minBurstInterval = 300;

    let isSongLoaded = false;
    let shouldStartOnLoad = false;
    let startScreen;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      rectMode(CENTER);
      noStroke();
      MAX_INIT_SIZE = max(width, height) * 0.4;
      MAX_ANGLE_STEP = PI / 20;
      SIZE_MULT = 0.88;
      MIN_SIZE = 8;
      initSize = MAX_INIT_SIZE;
      initAngle = 0;
      initColIndex = 0;

      amplitude = new p5.Amplitude();
      amplitude.smooth(0.8);

      startScreen = document.getElementById('startScreen');

      song = loadSound('m1.mp3', () => {
        console.log('m1.mp3 загружен');
        isSongLoaded = true;
        amplitude.setInput(song);
        if (shouldStartOnLoad) {
          startExperience();
        }
      }, (err) => {
        console.error('Ошибка загрузки m1.mp3:', err);
      });

      // Клик по экрану запускает/паузит
      startScreen.addEventListener('click', () => {
        if (isSongLoaded) {
          startExperience();
        } else {
          shouldStartOnLoad = true;
        }
      });

      const canvasEl = document.querySelector('canvas');
      canvasEl.addEventListener('click', togglePause);
      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        togglePause();
      }, { passive: false });

      // Пробел — запуск или пауза
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          if (!isPlaying) {
            if (isSongLoaded) {
              startExperience();
            } else {
              shouldStartOnLoad = true;
            }
          } else {
            togglePause();
          }
        }
      });
    }

    function startExperience() {
      startScreen.classList.add('hidden');
      setTimeout(() => {
        if (startScreen.parentNode) startScreen.remove();
      }, 500);

      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }

      if (song && isSongLoaded) {
        song.loop();
      }
      
      isPlaying = true;
      isPaused = false;
    }

    function togglePause() {
      if (!isPlaying) return;
      
      isPaused = !isPaused;
      
      if (isPaused) {
        pausedLevel = level;
        if (song) song.pause();
      } else {
        if (song) song.loop();
        lastBurstTime = millis();
      }
    }

    function draw() {
      if (!isPlaying) return;
      
      background(0);
      
      if (isPaused) {
        for (let particle of particles) {
          particle.show();
        }
        
        let count = sin(frameCount / 150);
        let angleStep = PI / 20 * count;
        let colIndex = initColIndex;
        let size = initSize * map(pausedLevel, 0, 0.5, 1, 1.5);
        let angle = initAngle;

        while (size > MIN_SIZE) {
          push();
          translate(width / 2, height / 2);
          rotate(angle);
          fill(cols[colIndex % cols.length]);
          ellipse(0, 0, size, size);
          pop();
          angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
          size *= 0.88;
          colIndex++;
        }
        return;
      }
      
      level = amplitude.getLevel();
      let delta = abs(level - lastLevel);
      let now = millis();
      if (delta > 0.03 && level > 0.05 && now - lastBurstTime > minBurstInterval) {
        particles = [];
        createBurst(initSize, cols[initColIndex % cols.length]);
        lastBurstTime = now;
      }
      lastLevel = level;

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].show();
        if (particles[i].isDead()) particles.splice(i, 1);
      }

      let count = sin(frameCount / 150);
      let angleStep = PI / 20 * count;
      let colIndex = initColIndex;
      let size = initSize * map(level, 0, 0.5, 1, 1.5);
      let angle = initAngle;

      while (size > MIN_SIZE) {
        push();
        translate(width / 2, height / 2);
        rotate(angle);
        fill(cols[colIndex % cols.length]);
        ellipse(0, 0, size, size);
        pop();
        angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
        size *= 0.88;
        colIndex++;
      }

      initSize -= MAX_INIT_SIZE * 0.0013 * (10 + abs(count));
      initAngle += angleStep * 0.1;

      if (initSize < MAX_INIT_SIZE * 0.88) {
        initSize /= 0.88;
        initColIndex = (initColIndex + cols.length - 1) % cols.length;
      }
    }

    function createBurst(size, color) {
      const numParticles = 50;
      const center = { x: width / 2, y: height / 2 };
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle(center.x, center.y, color));
      }
    }

    class Particle {
      constructor(x, y, col) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(3, 10));
        this.acc = createVector(0, 0);
        this.lifespan = 60;
        this.maxLife = this.lifespan;
        this.color = col;
        this.size = random(2, 4);
      }
      update() {
        this.vel.add(this.acc);
        this.pos.add(this.vel);
        this.lifespan--;
      }
      show() {
        let alpha = map(this.lifespan, 0, this.maxLife, 0, 255);
        if (this.lifespan < 15) alpha *= sin(frameCount * 0.2 + this.lifespan) * 0.5 + 0.5;
        noStroke();
        fill(red(this.color), green(this.color), blue(this.color), alpha);
        ellipse(this.pos.x, this.pos.y, this.size);
      }
      isDead() {
        return this.lifespan < 0;
      }
    }

    function keyPressed() {
      if (keyCode === ESC || keyCode === 32) {
        if (song && song.isPlaying()) song.pause();
        location.reload();
      }
      if (key === 'p' || key === 'P') {
        togglePause();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
