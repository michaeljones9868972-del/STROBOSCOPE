<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stroboscope - Ember</title>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon16x16.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background: #000; 
    }
    canvas { 
      display: block; 
      cursor: pointer; 
    }
    
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
      cursor: pointer;
      flex-direction: column;
      gap: 80px;
    }
    
    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    /* Ember — рукописный шрифт со звездочками (увеличен в 3 раза) */
    .ember-text {
      font-family: 'Dancing Script', cursive;
      font-size: 220px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 4px;
      user-select: none;
      text-shadow:
        0 0 20px rgba(255, 255, 255, 0.9),
        0 0 40px rgba(255, 255, 255, 0.7),
        0 0 60px rgba(255, 255, 255, 0.5),
        0 0 80px rgba(255, 255, 255, 0.3);
      animation: ember-glow 3s ease-in-out infinite alternate;
    }
    
    .stars {
      font-size: 60px;
      color: #ffffff;
      opacity: 0.7;
      animation: star-twinkle 2s ease-in-out infinite;
      margin: 0 20px;
    }
    
    @keyframes ember-glow {
      0% {
        text-shadow:
          0 0 20px rgba(255, 255, 255, 0.7),
          0 0 40px rgba(255, 255, 255, 0.5),
          0 0 60px rgba(255, 255, 255, 0.3);
        transform: scale(1);
      }
      100% {
        text-shadow:
          0 0 30px rgba(255, 255, 255, 1),
          0 0 60px rgba(255, 255, 255, 0.8),
          0 0 90px rgba(255, 255, 255, 0.6),
          0 0 120px rgba(255, 255, 255, 0.4);
        transform: scale(1.03);
      }
    }
    
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    
    /* START — разноцветные буквы с неоновым свечением */
    .start-text {
      font-family: 'Martian Mono', monospace;
      font-size: 100px;
      font-weight: 800;
      letter-spacing: 10px;
      user-select: none;
      display: flex;
      gap: 8px;
    }
    
    .start-letter {
      display: inline-block;
      animation: neon-pulse 2s ease-in-out infinite;
    }
    
    /* S - оранжевый */
    .start-letter:nth-child(1) {
      color: #FFB901;
      text-shadow:
        0 0 10px #FFB901,
        0 0 20px #FFB901,
        0 0 40px #FFB901,
        0 0 80px #FFB901;
      animation-delay: 0s;
    }
    
    /* T - розовый/красный */
    .start-letter:nth-child(2) {
      color: #E0908D;
      text-shadow:
        0 0 10px #E0908D,
        0 0 20px #E0908D,
        0 0 40px #E0908D,
        0 0 80px #E0908D;
      animation-delay: 0.2s;
    }
    
    /* A - фиолетовый */
    .start-letter:nth-child(3) {
      color: #8338EC;
      text-shadow:
        0 0 10px #8338EC,
        0 0 20px #8338EC,
        0 0 40px #8338EC,
        0 0 80px #8338EC;
      animation-delay: 0.4s;
    }
    
    /* R - бирюзовый */
    .start-letter:nth-child(4) {
      color: #47C9DD;
      text-shadow:
        0 0 10px #47C9DD,
        0 0 20px #47C9DD,
        0 0 40px #47C9DD,
        0 0 80px #47C9DD;
      animation-delay: 0.6s;
    }
    
    /* T - синий */
    .start-letter:nth-child(5) {
      color: #3A86FF;
      text-shadow:
        0 0 10px #3A86FF,
        0 0 20px #3A86FF,
        0 0 40px #3A86FF,
        0 0 80px #3A86FF;
      animation-delay: 0.8s;
    }
    
    @keyframes neon-pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <div>
      <span class="stars">✦</span>
      <span class="ember-text">Ember</span>
      <span class="stars">✦</span>
    </div>
    <div class="start-text" id="startText">
      <span class="start-letter">S</span>
      <span class="start-letter">T</span>
      <span class="start-letter">A</span>
      <span class="start-letter">R</span>
      <span class="start-letter">T</span>
    </div>
  </div>
  
  <script>
    let cols = ['#9AA8A8', '#466A44', '#E0D5BE', '#E0908D', '#C7495C', '#ffffff', '#680003', '#BC0000', '#F5704A', '#EFB9AD', '#828D00'];
    let MAX_INIT_SIZE, MAX_ANGLE_STEP, SIZE_MULT, MIN_SIZE;
    let initSize, initAngle, initColIndex;
    let isPlaying = false;
    let isPaused = false;
    let pausedLevel = 0;
    let song;
    let amplitude;
    let level;
    let lastLevel = 0;
    let particles = [];
    let lastBurstTime = 0;
    let minBurstInterval = 300;

    let isSongLoaded = false;
    let shouldStartOnLoad = false;
    let startScreen;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      rectMode(CENTER);
      noStroke();
      MAX_INIT_SIZE = max(width, height) * 0.4;
      MAX_ANGLE_STEP = PI / 20;
      SIZE_MULT = 0.88;
      MIN_SIZE = 8;
      initSize = MAX_INIT_SIZE;
      initAngle = 0;
      initColIndex = 0;

      amplitude = new p5.Amplitude();
      amplitude.smooth(0.8);

      startScreen = document.getElementById('startScreen');

      song = loadSound('m1.mp3', () => {
        console.log('m1.mp3 загружен');
        isSongLoaded = true;
        amplitude.setInput(song);
        if (shouldStartOnLoad) {
          startExperience();
        }
      }, (err) => {
        console.error('Ошибка загрузки m1.mp3:', err);
      });

      // Клик по экрану запускает/паузит
      startScreen.addEventListener('click', () => {
        if (isSongLoaded) {
          startExperience();
        } else {
          shouldStartOnLoad = true;
        }
      });

      const canvasEl = document.querySelector('canvas');
      canvasEl.addEventListener('click', togglePause);
      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        togglePause();
      }, { passive: false });

      // Пробел — запуск или пауза
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          if (!isPlaying) {
            if (isSongLoaded) {
              startExperience();
            } else {
              shouldStartOnLoad = true;
            }
          } else {
            togglePause();
          }
        }
      });
    }

    function startExperience() {
      startScreen.classList.add('hidden');
      setTimeout(() => {
        if (startScreen.parentNode) startScreen.remove();
      }, 500);

      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }

      if (song && isSongLoaded) {
        song.loop();
      }
      
      isPlaying = true;
      isPaused = false;
    }

    function togglePause() {
      if (!isPlaying) return;
      
      isPaused = !isPaused;
      
      if (isPaused) {
        pausedLevel = level;
        if (song) song.pause();
      } else {
        if (song) song.loop();
        lastBurstTime = millis();
      }
    }

    function draw() {
      if (!isPlaying) return;
      
      background(0);
      
      if (isPaused) {
        for (let particle of particles) {
          particle.show();
        }
        
        let count = sin(frameCount / 150);
        let angleStep = PI / 20 * count;
        let colIndex = initColIndex;
        let size = initSize * map(pausedLevel, 0, 0.5, 1, 1.5);
        let angle = initAngle;

        while (size > MIN_SIZE) {
          push();
          translate(width / 2, height / 2);
          rotate(angle);
          fill(cols[colIndex % cols.length]);
          ellipse(0, 0, size, size);
          pop();
          angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
          size *= 0.88;
          colIndex++;
        }
        return;
      }
      
      level = amplitude.getLevel();
      let delta = abs(level - lastLevel);
      let now = millis();
      if (delta > 0.03 && level > 0.05 && now - lastBurstTime > minBurstInterval) {
        particles = [];
        createBurst(initSize, cols[initColIndex % cols.length]);
        lastBurstTime = now;
      }
      lastLevel = level;

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].show();
        if (particles[i].isDead()) particles.splice(i, 1);
      }

      let count = sin(frameCount / 150);
      let angleStep = PI / 20 * count;
      let colIndex = initColIndex;
      let size = initSize * map(level, 0, 0.5, 1, 1.5);
      let angle = initAngle;

      while (size > MIN_SIZE) {
        push();
        translate(width / 2, height / 2);
        rotate(angle);
        fill(cols[colIndex % cols.length]);
        ellipse(0, 0, size, size);
        pop();
        angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
        size *= 0.88;
        colIndex++;
      }

      initSize -= MAX_INIT_SIZE * 0.0013 * (10 + abs(count));
      initAngle += angleStep * 0.1;

      if (initSize < MAX_INIT_SIZE * 0.88) {
        initSize /= 0.88;
        initColIndex = (initColIndex + cols.length - 1) % cols.length;
      }
    }

    function createBurst(size, color) {
      const numParticles = 50;
      const center = { x: width / 2, y: height / 2 };
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle(center.x, center.y, color));
      }
    }

    class Particle {
      constructor(x, y, col) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(3, 10));
        this.acc = createVector(0, 0);
        this.lifespan = 60;
        this.maxLife = this.lifespan;
        this.color = col;
        this.size = random(2, 4);
      }
      update() {
        this.vel.add(this.acc);
        this.pos.add(this.vel);
        this.lifespan--;
      }
      show() {
        let alpha = map(this.lifespan, 0, this.maxLife, 0, 255);
        if (this.lifespan < 15) alpha *= sin(frameCount * 0.2 + this.lifespan) * 0.5 + 0.5;
        noStroke();
        fill(red(this.color), green(this.color), blue(this.color), alpha);
        ellipse(this.pos.x, this.pos.y, this.size);
      }
      isDead() {
        return this.lifespan < 0;
      }
    }

    function keyPressed() {
      if (keyCode === ESC || keyCode === 32) {
        if (song && song.isPlaying()) song.pause();
        location.reload();
      }
      if (key === 'p' || key === 'P') {
        togglePause();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
