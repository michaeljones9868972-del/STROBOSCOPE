<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stroboscope - Цвета 1</title>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon16x16.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background: #000; 
    }
    canvas { 
      display: block; 
      cursor: pointer; 
    }
    
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
      cursor: pointer;
    }
    
    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .go-text {
      font-family: 'Martian Mono', monospace;
      font-size: 180px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 20px;
      user-select: none;
      text-shadow:
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 40px #a0d8f1,
        0 0 80px #a0d8f1,
        0 0 120px #6432c8,
        0 0 160px #6432c8,
        0 0 200px #6432c8;
      animation:
        magic-pulse 2s ease-in-out infinite,
        magic-glow 3s ease-in-out infinite alternate,
        magic-flicker 4s ease-in-out infinite;
    }
    
    @keyframes magic-pulse {
      0%, 100% { 
        transform: scale(1);
        opacity: 0.9;
      }
      50% { 
        transform: scale(1.15);
        opacity: 1;
      }
    }
    
    @keyframes magic-glow {
      0% {
        text-shadow:
          0 0 10px #fff,
          0 0 20px #fff,
          0 0 40px #a0d8f1,
          0 0 80px #a0d8f1,
          0 0 120px #6432c8,
          0 0 160px #6432c8,
          0 0 200px #6432c8;
      }
      33% {
        text-shadow:
          0 0 10px #fff,
          0 0 30px #fff,
          0 0 60px #fff,
          0 0 100px #a0d8f1,
          0 0 150px #a0d8f1,
          0 0 200px #6432c8,
          0 0 250px #6432c8,
          0 0 300px #6432c8;
      }
      66% {
        text-shadow:
          0 0 5px #fff,
          0 0 15px #fff,
          0 0 30px #a0d8f1,
          0 0 60px #a0d8f1,
          0 0 90px #6432c8,
          0 0 120px #6432c8;
      }
      100% {
        text-shadow:
          0 0 10px #fff,
          0 0 25px #fff,
          0 0 50px #fff,
          0 0 90px #a0d8f1,
          0 0 140px #a0d8f1,
          0 0 180px #6432c8,
          0 0 220px #6432c8,
          0 0 280px #6432c8;
      }
    }
    
    @keyframes magic-flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
      }
      20%, 24%, 55% {
        opacity: 0.6;
      }
    }
  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <div class="go-text" id="goText">GO</div>
  </div>
  
  <script>
    let cols = ['#9AA8A8', '#466A44', '#E0D5BE', '#E0908D', '#C7495C', '#ffffff', '#680003', '#BC0000', '#F5704A', '#EFB9AD', '#828D00'];
    let MAX_INIT_SIZE, MAX_ANGLE_STEP, SIZE_MULT, MIN_SIZE;
    let initSize, initAngle, initColIndex;
    let isPlaying = false;
    let isPaused = false;
    let pausedLevel = 0;
    let song;
    let amplitude;
    let level;
    let lastLevel = 0;
    let particles = [];
    let lastBurstTime = 0;
    let minBurstInterval = 300;

    let isSongLoaded = false;
    let shouldStartOnLoad = false;
    let startScreen, goText;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      rectMode(CENTER);
      noStroke();
      MAX_INIT_SIZE = max(width, height) * 0.4;
      MAX_ANGLE_STEP = PI / 20;
      SIZE_MULT = 0.88;
      MIN_SIZE = 8;
      initSize = MAX_INIT_SIZE;
      initAngle = 0;
      initColIndex = 0;

      amplitude = new p5.Amplitude();
      amplitude.smooth(0.8);

      startScreen = document.getElementById('startScreen');
      goText = document.getElementById('goText');

      song = loadSound('m1.mp3', () => {
        console.log('m1.mp3 загружен');
        isSongLoaded = true;
        amplitude.setInput(song);
        if (shouldStartOnLoad) {
          startExperience();
        }
      }, (err) => {
        console.error('Ошибка загрузки m1.mp3:', err);
      });

      startScreen.addEventListener('click', () => {
        if (isSongLoaded) {
          startExperience();
        } else {
          shouldStartOnLoad = true;
          goText.textContent = '...';
        }
      });

      const canvasEl = document.querySelector('canvas');
      canvasEl.addEventListener('click', togglePause);
      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        togglePause();
      }, { passive: false });
    }

    function startExperience() {
      startScreen.classList.add('hidden');
      setTimeout(() => {
        if (startScreen.parentNode) startScreen.remove();
      }, 500);

      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }

      if (song && isSongLoaded) {
        song.loop();
      }
      
      isPlaying = true;
      isPaused = false;
    }

    function togglePause() {
      if (!isPlaying) return;
      
      isPaused = !isPaused;
      
      if (isPaused) {
        pausedLevel = level;
        if (song) song.pause();
      } else {
        if (song) song.loop();
        lastBurstTime = millis();
      }
    }

    function draw() {
      if (!isPlaying) return;
      
      background(0);
      
      if (isPaused) {
        for (let particle of particles) {
          particle.show();
        }
        
        let count = sin(frameCount / 150);
        let angleStep = PI / 20 * count;
        let colIndex = initColIndex;
        let size = initSize * map(pausedLevel, 0, 0.5, 1, 1.5);
        let angle = initAngle;

        while (size > MIN_SIZE) {
          push();
          translate(width / 2, height / 2);
          rotate(angle);
          fill(cols[colIndex % cols.length]);
          ellipse(0, 0, size, size);
          pop();
          angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
          size *= 0.88;
          colIndex++;
        }
        return;
      }
      
      level = amplitude.getLevel();
      let delta = abs(level - lastLevel);
      let now = millis();
      if (delta > 0.03 && level > 0.05 && now - lastBurstTime > minBurstInterval) {
        particles = [];
        createBurst(initSize, cols[initColIndex % cols.length]);
        lastBurstTime = now;
      }
      lastLevel = level;

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].show();
        if (particles[i].isDead()) particles.splice(i, 1);
      }

      let count = sin(frameCount / 150);
      let angleStep = PI / 20 * count;
      let colIndex = initColIndex;
      let size = initSize * map(level, 0, 0.5, 1, 1.5);
      let angle = initAngle;

      while (size > MIN_SIZE) {
        push();
        translate(width / 2, height / 2);
        rotate(angle);
        fill(cols[colIndex % cols.length]);
        ellipse(0, 0, size, size);
        pop();
        angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
        size *= 0.88;
        colIndex++;
      }

      initSize -= MAX_INIT_SIZE * 0.0013 * (10 + abs(count));
      initAngle += angleStep * 0.1;

      if (initSize < MAX_INIT_SIZE * 0.88) {
        initSize /= 0.88;
        initColIndex = (initColIndex + cols.length - 1) % cols.length;
      }
    }

    function createBurst(size, color) {
      const numParticles = 50;
      const center = { x: width / 2, y: height / 2 };
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle(center.x, center.y, color));
      }
    }

    class Particle {
      constructor(x, y, col) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(3, 10));
        this.acc = createVector(0, 0);
        this.lifespan = 60;
        this.maxLife = this.lifespan;
        this.color = col;
        this.size = random(2, 4);
      }
      update() {
        this.vel.add(this.acc);
        this.pos.add(this.vel);
        this.lifespan--;
      }
      show() {
        let alpha = map(this.lifespan, 0, this.maxLife, 0, 255);
        if (this.lifespan < 15) alpha *= sin(frameCount * 0.2 + this.lifespan) * 0.5 + 0.5;
        noStroke();
        fill(red(this.color), green(this.color), blue(this.color), alpha);
        ellipse(this.pos.x, this.pos.y, this.size);
      }
      isDead() {
        return this.lifespan < 0;
      }
    }

    function keyPressed() {
      if (keyCode === ESC || keyCode === 32) {
        if (song && song.isPlaying()) song.pause();
        location.reload();
      }
      if (key === ' ' || key === 'p' || key === 'P') {
        togglePause();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
