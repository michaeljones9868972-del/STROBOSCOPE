<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stroboscope - Цвета 1</title>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon16x16.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      background: #000; 
    }
    canvas { 
      display: block; 
      cursor: pointer; 
    }
    
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    
    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .go-btn {
      position: relative;
      font-family: 'Martian Mono', monospace;
      font-size: 72px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(45deg, #ff006e, #8338ec, #3a86ff, #06d6a0, #ffbe0b, #ff006e);
      background-size: 400% 400%;
      border: none;
      padding: 40px 100px;
      cursor: pointer;
      letter-spacing: 8px;
      border-radius: 20px;
      text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4);
      box-shadow: 
        0 0 30px rgba(131, 56, 236, 0.6),
        0 0 60px rgba(58, 134, 255, 0.4),
        0 0 90px rgba(255, 0, 110, 0.3),
        inset 0 0 30px rgba(255,255,255,0.2);
      animation: 
        gradient-shift 3s ease infinite,
        pulse 2s ease-in-out infinite,
        glow 1.5s ease-in-out infinite alternate;
      transition: transform 0.2s;
      outline: none;
    }
    
    .go-btn:hover {
      transform: scale(1.1);
    }
    
    .go-btn:active {
      transform: scale(0.95);
    }
    
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    
    @keyframes glow {
      0% { 
        box-shadow: 
          0 0 30px rgba(131, 56, 236, 0.6),
          0 0 60px rgba(58, 134, 255, 0.4),
          0 0 90px rgba(255, 0, 110, 0.3),
          inset 0 0 30px rgba(255,255,255,0.2);
        opacity: 0.85;
      }
      100% { 
        box-shadow: 
          0 0 50px rgba(131, 56, 236, 0.9),
          0 0 100px rgba(58, 134, 255, 0.7),
          0 0 150px rgba(255, 0, 110, 0.5),
          0 0 200px rgba(6, 214, 160, 0.3),
          inset 0 0 50px rgba(255,255,255,0.4);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <button class="go-btn" id="goBtn">GO</button>
  </div>
  
  <script>
    let cols = ['#9AA8A8', '#466A44', '#E0D5BE', '#E0908D', '#C7495C', '#ffffff', '#680003', '#BC0000', '#F5704A', '#EFB9AD', '#828D00'];
    let MAX_INIT_SIZE, MAX_ANGLE_STEP, SIZE_MULT, MIN_SIZE;
    let initSize, initAngle, initColIndex;
    let isPlaying = false;
    let isPaused = false;
    let pausedLevel = 0;
    let song;
    let amplitude;
    let level;
    let lastLevel = 0;
    let particles = [];
    let lastBurstTime = 0;
    let minBurstInterval = 300;

    let isSongLoaded = false;
    let shouldStartOnLoad = false;
    let startScreen, goBtn;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      rectMode(CENTER);
      noStroke();
      MAX_INIT_SIZE = max(width, height) * 0.4;
      MAX_ANGLE_STEP = PI / 20;
      SIZE_MULT = 0.88;
      MIN_SIZE = 8;
      initSize = MAX_INIT_SIZE;
      initAngle = 0;
      initColIndex = 0;

      amplitude = new p5.Amplitude();
      amplitude.smooth(0.8);

      startScreen = document.getElementById('startScreen');
      goBtn = document.getElementById('goBtn');

      song = loadSound('m1.mp3', () => {
        console.log('m1.mp3 загружен');
        isSongLoaded = true;
        amplitude.setInput(song);
        if (shouldStartOnLoad) {
          startExperience();
        }
      }, (err) => {
        console.error('Ошибка загрузки m1.mp3:', err);
      });

      goBtn.addEventListener('click', () => {
        if (isSongLoaded) {
          startExperience();
        } else {
          shouldStartOnLoad = true;
          goBtn.textContent = '...';
          goBtn.style.pointerEvents = 'none';
        }
      });

      const canvasEl = document.querySelector('canvas');
      canvasEl.addEventListener('click', togglePause);
      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        togglePause();
      }, { passive: false });
    }

    function startExperience() {
      startScreen.classList.add('hidden');
      setTimeout(() => {
        if (startScreen.parentNode) startScreen.remove();
      }, 500);

      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }

      if (song && isSongLoaded) {
        song.loop();
      }
      
      isPlaying = true;
      isPaused = false;
    }

    function togglePause() {
      if (!isPlaying) return;
      
      isPaused = !isPaused;
      
      if (isPaused) {
        pausedLevel = level;
        if (song) song.pause();
      } else {
        if (song) song.loop();
        lastBurstTime = millis();
      }
    }

    function draw() {
      if (!isPlaying) return;
      
      background(0);
      
      if (isPaused) {
        for (let particle of particles) {
          particle.show();
        }
        
        let count = sin(frameCount / 150);
        let angleStep = PI / 20 * count;
        let colIndex = initColIndex;
        let size = initSize * map(pausedLevel, 0, 0.5, 1, 1.5);
        let angle = initAngle;

        while (size > MIN_SIZE) {
          push();
          translate(width / 2, height / 2);
          rotate(angle);
          fill(cols[colIndex % cols.length]);
          ellipse(0, 0, size, size);
          pop();
          angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
          size *= 0.88;
          colIndex++;
        }
        return;
      }
      
      level = amplitude.getLevel();
      let delta = abs(level - lastLevel);
      let now = millis();
      if (delta > 0.03 && level > 0.05 && now - lastBurstTime > minBurstInterval) {
        particles = [];
        createBurst(initSize, cols[initColIndex % cols.length]);
        lastBurstTime = now;
      }
      lastLevel = level;

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].show();
        if (particles[i].isDead()) particles.splice(i, 1);
      }

      let count = sin(frameCount / 150);
      let angleStep = PI / 20 * count;
      let colIndex = initColIndex;
      let size = initSize * map(level, 0, 0.5, 1, 1.5);
      let angle = initAngle;

      while (size > MIN_SIZE) {
        push();
        translate(width / 2, height / 2);
        rotate(angle);
        fill(cols[colIndex % cols.length]);
        ellipse(0, 0, size, size);
        pop();
        angle += angleStep * map(size, MIN_SIZE, MAX_INIT_SIZE * 1.5, 1, 0, false);
        size *= 0.88;
        colIndex++;
      }

      initSize -= MAX_INIT_SIZE * 0.0013 * (10 + abs(count));
      initAngle += angleStep * 0.1;

      if (initSize < MAX_INIT_SIZE * 0.88) {
        initSize /= 0.88;
        initColIndex = (initColIndex + cols.length - 1) % cols.length;
      }
    }

    function createBurst(size, color) {
      const numParticles = 50;
      const center = { x: width / 2, y: height / 2 };
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle(center.x, center.y, color));
      }
    }

    class Particle {
      constructor(x, y, col) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(3, 10));
        this.acc = createVector(0, 0);
        this.lifespan = 60;
        this.maxLife = this.lifespan;
        this.color = col;
        this.size = random(2, 4);
      }
      update() {
        this.vel.add(this.acc);
        this.pos.add(this.vel);
        this.lifespan--;
      }
      show() {
        let alpha = map(this.lifespan, 0, this.maxLife, 0, 255);
        if (this.lifespan < 15) alpha *= sin(frameCount * 0.2 + this.lifespan) * 0.5 + 0.5;
        noStroke();
        fill(red(this.color), green(this.color), blue(this.color), alpha);
        ellipse(this.pos.x, this.pos.y, this.size);
      }
      isDead() {
        return this.lifespan < 0;
      }
    }

    function keyPressed() {
      if (keyCode === ESC || keyCode === 32) {
        if (song && song.isPlaying()) song.pause();
        location.reload();
      }
      if (key === ' ' || key === 'p' || key === 'P') {
        togglePause();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
